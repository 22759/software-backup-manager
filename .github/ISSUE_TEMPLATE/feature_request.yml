---
name: 功能建议
description: 提出一个新功能或改进想法
labels: enhancement
body:
  - type: textarea
    id: idea
    attributes:
      label: 想解决什么问题
      description: 从使用场景出发描述，比直接说「加个 XX 按钮」更有用
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过什么别的办法
    validations:
      required: false
