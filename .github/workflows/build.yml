name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# GITHUB_TOKEN 默认是只读的；不显式给 contents: write，
# 打 tag 时创建 Release 会报 403 "Resource not accessible by integration"。
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    name: 打包 SoftwareManager.exe

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller

      - name: 打包
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name SoftwareManager --icon icon.ico --add-data "web;web" app.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SoftwareManager
          path: dist/SoftwareManager.exe
          if-no-files-found: error

      # 只在手动触发（workflow_dispatch）时发布 Release。
      # push tag 时也自动发会和「人工审查后手动 Publish」的流程冲突，
      # 而且 CI 机器缺 WebView2 运行时，打出来的 exe 比本机版小 6MB。
      - name: 手动触发时发布到 Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SoftwareManager.exe
          generate_release_notes: true
